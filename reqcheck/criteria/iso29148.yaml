# Каталог критериев качества требований по ISO/IEC/IEEE 29148:2018.
# §5.2.5 — свойства отдельного требования (scope: requirement),
# §5.2.6 — свойства набора требований (scope: set),
# §5.2.7 — языковые критерии (неограниченные и расплывчатые термины) — раздел language_guidance.
# Определения — собственный пересказ, не текст стандарта.
# Ключи criteria.* совпадают со значениями reqcheck.models.Criterion.

source: "ISO/IEC/IEEE 29148:2018"
version: 1

criteria:

  necessary:
    name_ru: "Необходимость"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Требование описывает возможность, характеристику или ограничение, без которого цель
      документа не достигается; если его удалить, система лишится чего-то нужного заинтересованным
      лицам. Требование не дублирует другое и не является пожеланием, описанием текущего состояния
      или справкой.
    check_questions:
      - "Можно ли связать требование с целью документа или бизнес-требованием, которое в нём названо?"
      - "Ухудшится ли результат для клиента, бизнеса или эксплуатации, если требование удалить?"
      - "Не повторяет ли требование другое требование того же документа другими словами?"
      - "Это обязательство системы, а не пояснение, пример, история или пожелание («было бы хорошо»)?"
      - "Не описывает ли текст поведение, которое уже обеспечивается вне границ задачи и не меняется?"
    typical_defects:
      - "Дубли: одно и то же правило в функциональных требованиях, в особых правилах API и в BPMN, иногда с расхождениями."
      - "Пожелания и мотивация, оформленные как требование («желательно», «хотелось бы»)."
      - "Требование не связано ни с одной заявленной целью (функция «на всякий случай»)."
      - "Пояснительный текст или шаблонная заглушка, попавшие в список требований."
    severity_guide:
      critical: "Почти не встречается: только если лишнее требование навязывает поведение, конфликтующее с целью."
      major: "Требование не связано с целью и потребует заметной разработки или тестирования."
      minor: "Дубль без расхождений, пояснение или пожелание в списке требований."

  appropriate:
    name_ru: "Уместность (уровень абстракции, без лишних проектных решений)"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Детализация требования соответствует уровню документа: требование говорит, ЧТО должно
      выполняться и при каких условиях, и не навязывает без необходимости КАК (конкретные таблицы,
      технологии, алгоритмы, экранные элементы, внутренние компоненты). Проектное решение допустимо,
      только если оно является реальным ограничением, и тогда должно быть так обозначено.
    check_questions:
      - "Есть ли в требовании конкретная технология, СУБД, таблица, класс, алгоритм или имя компонента, хотя цель достижима иначе?"
      - "Если проектное решение есть, указано ли, почему оно обязательно (ограничение платформы, регулятора, совместимость)?"
      - "Соответствует ли уровень детализации разделу? Бизнес-требование не должно содержать имён полей БД, а спецификация API — может."
      - "Не подменяет ли описание интерфейса (кнопка, экран) само требование к поведению?"
      - "Не смешаны ли в одном пункте бизнес-цель и решение по реализации?"
    typical_defects:
      - "Имена таблиц, полей, контроллеров или очередей в функциональном требовании бизнес-уровня."
      - "Указание технологии («через Kafka», «хранить в Redis») без обоснования как ограничения."
      - "Требование сформулировано как шаг реализации («вызвать метод X»), а не как наблюдаемое поведение."
      - "Детали UI (цвет, расположение кнопки) вместо требования к информации или действию пользователя."
    severity_guide:
      critical: "Проектное решение противоречит другому требованию или делает требование невыполнимым."
      major: "Навязанное решение ограничивает реализацию без объяснения и влияет на архитектуру или интеграцию."
      minor: "Лишняя техническая деталь, которая не мешает, но размывает уровень документа."

  unambiguous:
    name_ru: "Однозначность"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Требование допускает только одно толкование: разные читатели (аналитик, разработчик,
      тестировщик) поймут его одинаково. Термины определены, границы диапазонов, единицы, моменты
      времени, субъект действия и условия срабатывания указаны явно.
    check_questions:
      - "Есть ли расплывчатые или неограниченные слова (быстро, удобно, своевременно, при необходимости, и т.д., все, всегда)?"
      - "Ясно, кто выполняет действие (система, какой сервис, пользователь), или фраза безличная/в пассиве?"
      - "Указаны ли границы диапазона (включительно/исключительно), единицы измерения и валюта?"
      - "Однозначно ли определён момент времени, часовой пояс и событие, от которого считается срок или период?"
      - "Понятно ли, к чему относятся местоимения и сокращения («он», «это», «такой», «данная операция»)?"
      - "Не допускают ли логические связки двух прочтений («и/или», «или» как включающее/исключающее, двойное отрицание)?"
    typical_defects:
      - "Не указано, включительна ли граница («до 1 000», «больше N» без «или равно»)."
      - "Термин без определения или одно понятие под разными названиями."
      - "Период «за месяц» без указания календарный ли он, по какой дате операции и в каком часовом поясе."
      - "Сумма без единицы (основная/дробная единица валюты) или без валюты."
      - "Лазейки «по возможности», «как правило», «при необходимости» — неизвестно, кто и как решает."
      - "Безличный пассив «отправляется», «сохраняется» без указания системы или условия."
    severity_guide:
      critical: "Разные толкования ключевого правила дают разный результат для клиента или денег (сумма, период, срабатывание)."
      major: "Неоднозначность во второстепенном правиле или там, где есть разумное преобладающее толкование."
      minor: "Неточность формулировки, которую контекст снимает однозначно."

  complete:
    name_ru: "Полнота (отдельного требования)"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Требование самодостаточно: в нём (или по явной ссылке) есть всё, чтобы его реализовать и
      проверить — условия, входы, ожидаемая реакция, допустимые значения, реакция на недопустимые
      значения и пограничные случаи. Нет «TBD», пустых полей и ссылок на неопределённое.
    check_questions:
      - "Определена ли реакция системы для всех веток условия (иначе, ошибка, граница, пустое значение)?"
      - "Указаны ли все параметры правила: значения, единицы, допустимый диапазон, значение по умолчанию?"
      - "Нет ли заглушек «TBD», «уточнить», «—», «заполняется позже» на месте значимого содержания?"
      - "Если есть ссылка на другой документ или раздел, существует ли он и однозначно назван?"
      - "Понятно ли, что происходит при повторе, отмене или изменении входного события?"
    typical_defects:
      - "Описана только успешная ветка, нет поведения при ошибке, отказе внешней системы или недопустимом вводе."
      - "Условие «если A» без «иначе»; диапазон без поведения на границах."
      - "Пустые поля шаблона («Prod: —», «Swagger: —») в значимых местах."
      - "Ссылка на справочник, список или документ, который не приложен."
    severity_guide:
      critical: "Не определена ветка ключевого сценария, и разработчику придётся самому выбирать бизнес-правило."
      major: "Не определена второстепенная ветка, обработка ошибки или значение по умолчанию."
      minor: "Незаполненное служебное поле без влияния на поведение."

  singular:
    name_ru: "Единичность (атомарность)"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Одно требование выражает одну возможность или одно правило, чтобы его можно было отдельно
      трассировать, реализовать и проверить. Несколько независимых обязательств в одном пункте
      допустимы только если они неразделимы по смыслу.
    check_questions:
      - "Содержит ли пункт несколько независимых обязательств, соединённых «и», «а также», точкой с запятой или несколькими предложениями?"
      - "Можно ли выполнить одну часть пункта и не выполнить другую (то есть статус приёмки будет «частично»)?"
      - "Не смешаны ли в одном пункте правило, исключение и значение по умолчанию, у которых разные тесты?"
      - "Не скрыто ли в пункте ещё одно требование из другого класса (нефункциональное, к данным, к UI)?"
    typical_defects:
      - "Пункт из 3–4 предложений с разными правилами (диапазон, значение по умолчанию, исключения)."
      - "Функциональное правило и нефункциональный срок в одной фразе."
      - "Список исключений внутри правила, без отдельной идентификации каждого."
    severity_guide:
      critical: "Не применяется."
      major: "Составное требование уже вызывает путаницу: части противоречат друг другу или имеют разные условия."
      minor: "Несколько правил в одном пункте мешают трассировке и приёмке, но каждое из них ясно."

  feasible:
    name_ru: "Выполнимость"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Требование можно реализовать в известных ограничениях (технологии, данные, сроки, внешние
      системы, регулирование) с приемлемым риском. Оно не опирается на данные или события,
      которых у системы нет, и не требует физически недостижимого.
    check_questions:
      - "Есть ли у системы данные или события, на которые опирается требование (в момент, когда они нужны)?"
      - "Не требуется ли абсолютное («никогда», «100%», «мгновенно», «0 ошибок»)?"
      - "Совместимо ли требование с тем, как работают названные внешние системы и процессы (например, порядок и задержка событий)?"
      - "Не зависит ли выполнение от действия внешней стороны, которой система не управляет?"
    typical_defects:
      - "Гарантия доставки внешним каналом (push, SMS) как обязательство системы, хотя доставку контролирует оператор."
      - "Решение «в момент операции» по данным, которые приходят позже (окончательная сумма, курс, клиринг)."
      - "Абсолютные гарантии без допуска (100% доступность, мгновенно)."
    severity_guide:
      critical: "Требование ключевого сценария невыполнимо в принципе при описанных источниках данных."
      major: "Выполнимо только при дополнительных допущениях, которые в документе не названы."
      minor: "Формулировка чрезмерно абсолютна, но очевидный смысл выполним."

  verifiable:
    name_ru: "Проверяемость"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Выполнение требования можно доказать конечной объективной процедурой — тестом, анализом,
      инспекцией или демонстрацией — с однозначным критерием «выполнено / не выполнено».
      Для количественных свойств задано значение, единица, условия и способ измерения.
    check_questions:
      - "Можно ли написать тест с однозначным ожидаемым результатом по этому тексту без дополнительных вопросов?"
      - "Для сроков и производительности: указаны ли число, единица, точка начала и конца отсчёта, перцентиль или доля, нагрузка?"
      - "Нет ли субъективных критериев (удобно, понятно, корректно, надёжно) без измеримой расшифровки?"
      - "Наблюдаем ли результат (через API, UI, журнал, данные), чтобы тестировщик мог его проверить?"
      - "Не сформулировано ли требование через отрицание или бесконечность («никогда не», «при любых условиях»), что нельзя доказать тестом?"
    typical_defects:
      - "«В течение минуты» без указания, от какого события и для какой доли случаев."
      - "«Корректно обрабатывает», «надёжно хранит», «удобный интерфейс»."
      - "Ожидаемый результат критерия приёмки не наблюдаем или зависит от неуказанных условий."
    severity_guide:
      critical: "Ключевое поведение или ключевой NFR нельзя проверить — приёмка невозможна."
      major: "Проверка возможна только после уточнения метода измерения или условий."
      minor: "Мелкая неточность в критерии, не мешающая проверке по смыслу."

  correct:
    name_ru: "Корректность"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5; IEEE 830-1998 §4.3.1"
    scope: requirement
    definition_ru: >-
      Требование верно отражает потребность заинтересованных лиц и известные факты предметной
      области: числа, примеры и расчёты внутри него сходятся, примеры согласуются с правилом,
      а названные коды, статусы и единицы соответствуют своему смыслу.
    check_questions:
      - "Сходятся ли арифметика и примеры внутри требования (суммы, границы, даты)?"
      - "Соответствуют ли HTTP-статусы, коды ошибок, названия методов своему смыслу (например, GET не изменяет состояние, 201 — создание)?"
      - "Не противоречит ли требование собственной цели или названию раздела?"
      - "Совпадают ли единицы и типы данных с тем, что указано в описании (сумма «в тенге», а тип — дробный, и т.п.)?"
    typical_defects:
      - "Пример ответа API не соответствует описанной структуре или статусу."
      - "Статус-код или метод использован не по назначению."
      - "Ожидаемый результат примера не следует из описанного правила."
    severity_guide:
      critical: "Ошибка в ключевом правиле или контракте, которая приведёт к неправильным деньгам, данным или доступу."
      major: "Ошибка в примере, статусе или описании, из-за которой реализации разойдутся."
      minor: "Опечатка в числе или названии, однозначно исправляемая по контексту."

  conforming:
    name_ru: "Соответствие шаблону и правилам оформления"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.5"
    scope: requirement
    definition_ru: >-
      Требование оформлено по принятому в организации шаблону и правилам: имеет идентификатор,
      заполнены обязательные поля шаблона, используется единая терминология и формат значений,
      требование размещено в правильном разделе.
    check_questions:
      - "Есть ли у требования уникальный идентификатор или его можно однозначно адресовать?"
      - "Заполнены ли обязательные поля шаблона (версия, автор, согласующие, URL, тип запроса)?"
      - "Используется ли единый формат значений (суммы, даты, флаги) по всему документу?"
      - "Находится ли требование в разделе своего типа (NFR не спрятан в функциональных, данные — в разделе данных)?"
    typical_defects:
      - "Незаполненные поля шаблона, «Да / Нет» без отметки, пустые таблицы."
      - "Требования без идентификаторов в разделах NFR, данных, интеграции."
      - "Разные форматы одного значения (флаг строкой «0/1» и числом)."
    severity_guide:
      critical: "Не применяется."
      major: "Незаполненное поле шаблона скрывает значимую информацию (окружение, автор, версия контракта)."
      minor: "Отклонения оформления без влияния на смысл."

  # ------------------------------------------------------------ §5.2.6 набор ---

  set_complete:
    name_ru: "Полнота набора"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.6; IEEE 830-1998 §4.3.3"
    scope: set
    definition_ru: >-
      Набор требований покрывает все существенные возможности, характеристики, ограничения и
      условия, нужные для достижения цели: все ветки бизнес-процесса, реакции на допустимые и
      недопустимые входы, нефункциональные категории, данные, интеграцию, эксплуатацию.
      Ничего ключевого не оставлено «на усмотрение» разработчика.
    check_questions:
      - "Для каждого события и состояния процесса определено поведение, включая отмену, повтор, ошибку и сбой внешней системы?"
      - "Покрыты ли нефункциональные категории, значимые для задачи (производительность, доступность, безопасность, аудит, хранение данных)?"
      - "Есть ли критерии приёмки для каждой ключевой ветки правил?"
      - "Описаны ли все интеграции: кто вызывает, какие данные, формат, ошибки, повторы?"
      - "Указаны ли откат, мониторинг и включение функциональности (если чек-лист шаблона этого требует)?"
    typical_defects:
      - "Описан успешный путь, нет отказов внешних систем, повторов и отмен."
      - "Нет NFR по безопасности и хранению данных при работе с персональными или карточными данными."
      - "Разделы шаблона оставлены пустыми или «заполняются позже»."
    severity_guide:
      critical: "Отсутствует ветка или категория, без которой ключевой сценарий нельзя реализовать или протестировать."
      major: "Отсутствует второстепенная ветка, эксплуатационное требование или критерий приёмки."
      minor: "Пустой служебный раздел, не влияющий на реализацию."

  set_consistent:
    name_ru: "Непротиворечивость набора"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.6; IEEE 830-1998 §4.3.4"
    scope: set
    definition_ru: >-
      Требования не противоречат друг другу: их можно выполнить одновременно, они используют
      одинаковые термины, единицы и форматы для одного и того же, а критерии приёмки и примеры
      согласуются с правилами.
    check_questions:
      - "Есть ли пара требований, которые нельзя выполнить одновременно (логически, по числам, по срокам, по порядку правил)?"
      - "Одно понятие названо по-разному или одно название обозначает разные вещи?"
      - "Совпадают ли единицы, типы и диапазоны одного значения в разных разделах (бизнес-требования, API, данные)?"
      - "Согласуются ли критерии приёмки и примеры с правилами?"
      - "Одинаково ли определены моменты и периоды времени во всех местах?"
    typical_defects:
      - "Диапазон или единица значения в бизнес-части и в API различаются."
      - "Описание назначения метода не соответствует его типу или логике."
      - "Пример ожидаемого результата противоречит правилу о периоде или исключениях."
      - "Описание статусов ответа противоречит примерам ответов."
    severity_guide:
      critical: "Противоречие в ключевом правиле или контракте: реализация обязательно нарушит одно из требований."
      major: "Расхождение терминов или форматов, которое приведёт к разным реализациям у разных команд."
      minor: "Разнобой в названиях без риска неверной реализации."

  set_feasible:
    name_ru: "Выполнимость набора"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.6"
    scope: set
    definition_ru: >-
      Весь набор требований можно реализовать вместе в рамках ограничений проекта: совокупные
      сроки, зависимости между системами, порядок событий и доступность данных не делают набор
      невыполнимым, даже если каждое требование по отдельности выполнимо.
    check_questions:
      - "Совместимы ли требования к срокам с цепочкой систем, через которую проходит событие?"
      - "Доступны ли данные, нужные одному требованию, в момент, когда их требует другое?"
      - "Не требует ли набор одновременно строгой согласованности и асинхронной обработки без механизма согласования?"
      - "Названы ли владельцы всех затронутых систем и согласованы ли изменения?"
    typical_defects:
      - "Мгновенная реакция на событие, которое по описанию процесса приходит с задержкой или может прийти повторно."
      - "Изменения в нескольких системах без согласованных с владельцами интерфейсов."
    severity_guide:
      critical: "Набор невыполним без изменения бизнес-правил."
      major: "Выполним при дополнительных допущениях или согласованиях, которые не зафиксированы."
      minor: "Риск выполнимости низкий, но стоит зафиксировать допущение."

  set_comprehensible:
    name_ru: "Понятность набора"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.6"
    scope: set
    definition_ru: >-
      Набор понятен своей аудитории: ясно, что система должна делать и какое место эта
      доработка занимает в целом процессе; термины определены, структура документа логична,
      связи между частями (бизнес-требования, диаграммы, API) явные.
    check_questions:
      - "Определены ли ключевые термины (глоссарий или определение при первом использовании)?"
      - "Понятно ли из документа, какая система за что отвечает?"
      - "Согласованы ли текстовые описания, диаграммы и таблицы между собой по составу участников и шагов?"
      - "Не перегружены ли формулировки сокращениями без расшифровки?"
    typical_defects:
      - "Нет глоссария, ключевые понятия используются без определения."
      - "Диаграмма и текст описывают разный состав систем или шагов."
    severity_guide:
      critical: "Не применяется, кроме случая, когда документ нельзя понять без автора."
      major: "Отсутствие определений ведёт к разным толкованиям ключевых понятий."
      minor: "Отдельные неудобные формулировки или сокращения."

  set_validatable:
    name_ru: "Валидируемость набора"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.6"
    scope: set
    definition_ru: >-
      Можно убедиться, что реализация набора требований удовлетворит потребность заинтересованных
      лиц и цель документа: цель сформулирована измеримо, критерии приёмки показывают, что цель
      достигнута, есть владелец, который подтверждает результат.
    check_questions:
      - "Сформулирована ли цель так, что можно проверить её достижение (метрика, наблюдаемый эффект)?"
      - "Связывают ли критерии приёмки цель с поведением системы?"
      - "Назван ли владелец, который принимает результат, и процедура согласования?"
    typical_defects:
      - "Цель описана общими словами без измеримого эффекта."
      - "Критерии приёмки проверяют только расчёт, но не достижение цели для клиента."
      - "Блок согласования пуст или без отметок."
    severity_guide:
      critical: "Не применяется."
      major: "Невозможно подтвердить достижение цели: нет измеримой цели и владельца приёмки."
      minor: "Цель измерима частично."

  set_bounded:
    name_ru: "Ограниченность (границы) набора"
    standard: "ISO/IEC/IEEE 29148:2018 §5.2.6"
    scope: set
    definition_ru: >-
      Набор не выходит за рамки цели и явно задаёт границы решения: что входит в объём, что не
      входит, какие системы затрагиваются, какие допущения и зависимости принимаются.
    check_questions:
      - "Указано ли явно, что не входит в объём (вне скоупа)?"
      - "Перечислены ли затрагиваемые системы и границы ответственности каждой?"
      - "Нет ли требований, выходящих за пределы заявленной цели?"
      - "Зафиксированы ли допущения и внешние зависимости?"
    typical_defects:
      - "Нет раздела «вне объёма», неясно, распространяется ли правило на смежные продукты (другие валюты, типы карт, каналы)."
      - "Требования к системам, которые не названы во влиянии на ИС."
    severity_guide:
      critical: "Не применяется."
      major: "Неясные границы ведут к спору об объёме работ (какие продукты, валюты, каналы входят)."
      minor: "Границы понятны из контекста, но не зафиксированы явно."

# ------------------------------------------------------------- §5.2.7 язык ---
# Языковые признаки неоднозначности и непроверяемости. Используются review_requirement
# и линтерами; для каждого — пример русских маркеров.
language_guidance:
  standard: "ISO/IEC/IEEE 29148:2018 §5.2.7"
  principle_ru: >-
    Нормативное требование формулируется утвердительно, с явным субъектом и обязательностью
    («Система должна…»), без расплывчатых и неограниченных слов. Каждое такое слово либо
    заменяется измеримым значением, либо определяется в глоссарии.
  term_classes:
    - class_ru: "Превосходная степень"
      markers: ["лучший", "наилучший", "максимально", "оптимальный", "минимально возможный"]
      fix_ru: "Заменить числовым целевым значением и способом измерения."
    - class_ru: "Субъективные оценки"
      markers: ["удобный", "простой", "понятный", "дружественный", "интуитивный", "красивый", "эффективный"]
      fix_ru: "Заменить наблюдаемым критерием (число шагов, время выполнения, доля успешных сценариев)."
    - class_ru: "Расплывчатые наречия и прилагательные"
      markers: ["быстро", "своевременно", "оперативно", "незамедлительно", "существенный", "значительный", "небольшой", "достаточный", "почти всегда", "как правило"]
      fix_ru: "Указать число, единицу, точку отсчёта и долю случаев."
    - class_ru: "Открытые формулировки"
      markers: ["и т.д.", "и т.п.", "и другие", "включая, но не ограничиваясь", "как минимум", "поддерживать", "обеспечить поддержку"]
      fix_ru: "Перечислить исчерпывающий список или правило, по которому он определяется."
    - class_ru: "Сравнения без базы"
      markers: ["быстрее", "лучше", "больше чем раньше", "выше качество"]
      fix_ru: "Указать базовое значение и целевое значение."
    - class_ru: "Лазейки"
      markers: ["по возможности", "при необходимости", "если применимо", "при наличии", "может", "в случае необходимости", "желательно"]
      fix_ru: "Указать условие срабатывания и кто его определяет либо сделать требование безусловным."
    - class_ru: "Слова тотальности"
      markers: ["все", "всегда", "никогда", "любой", "каждый", "ни один", "полностью"]
      fix_ru: "Проверить, действительно ли нет исключений; перечислить исключения или ограничить область."
    - class_ru: "Неясные ссылки и местоимения"
      markers: ["он", "она", "это", "такой", "данный", "соответствующий", "указанный выше", "согласно документу"]
      fix_ru: "Заменить конкретным названием объекта или точной ссылкой на раздел/документ."
    - class_ru: "Безличный пассив"
      markers: ["отправляется", "сохраняется", "проверяется", "обрабатывается", "выполняется"]
      fix_ru: "Указать систему-исполнителя и условие: «Сервис X отправляет … при …»."
    - class_ru: "Отрицательные формулировки"
      markers: ["не должен", "не допускается", "исключается"]
      fix_ru: "Где возможно, сформулировать положительно и перечислить, что допускается; иначе указать, как проверяется отсутствие."
