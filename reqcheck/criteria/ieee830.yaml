# Каталог критериев по IEEE Std 830-1998 §4.3 («характеристики хорошей SRS»).
# Здесь полностью описаны критерии, которых нет в ISO 29148 §5.2.5/§5.2.6 как отдельных:
# ranked, modifiable, traceable. Остальные характеристики §4.3 сопоставлены с критериями
# ISO 29148 (раздел cross_reference) и дают дополнительные проверки.
# Определения — собственный пересказ, не текст стандарта.

source: "IEEE Std 830-1998"
version: 1

criteria:

  ranked:
    name_ru: "Ранжирование по важности и стабильности"
    standard: "IEEE 830-1998 §4.3.5"
    scope: set
    definition_ru: >-
      У каждого требования (или группы) обозначена важность (обязательно / желательно /
      опционально или приоритет) и/или стабильность (насколько вероятно изменение). Это позволяет
      планировать объём, принимать решения при нехватке сроков и фокусировать тестирование.
    check_questions:
      - "Указан ли приоритет или обязательность хотя бы для функциональных требований?"
      - "Отличимы ли обязательные требования от пожеланий (по модальности «должен» / «может» или явной метке)?"
      - "Отмечены ли требования, которые вероятно изменятся (значения порогов, лимиты, тексты)?"
      - "Понятно ли, что можно отложить, если сроки сокращаются?"
    typical_defects:
      - "Все требования равнозначны, приоритеты не указаны."
      - "Смешение «должен» и «может» без договорённости, что это означает."
    severity_guide:
      critical: "Не применяется."
      major: "Объём большой, а приоритетов нет — невозможно планировать поставку и регрессию."
      minor: "Небольшой документ без приоритетов, где все требования очевидно обязательные."

  modifiable:
    name_ru: "Модифицируемость"
    standard: "IEEE 830-1998 §4.3.7"
    scope: set
    definition_ru: >-
      Структура документа позволяет вносить изменения легко, полно и согласованно: каждое
      правило записано в одном месте, остальные ссылаются на него; есть оглавление и нумерация;
      документ версионирован и хранит историю изменений.
    check_questions:
      - "Записано ли каждое правило один раз, или одно и то же продублировано в нескольких разделах (бизнес-часть, API, особые правила)?"
      - "Есть ли версия, дата и история изменений документа?"
      - "Есть ли уникальная нумерация разделов и требований для ссылок?"
      - "Не смешаны ли в одном пункте разные требования, из-за чего правка одного затрагивает другие?"
    typical_defects:
      - "Одно правило (диапазон, период, повторное сохранение) повторено в нескольких местах — при изменении легко обновить не все."
      - "Версия и дата документа не заполнены."
      - "Требования в NFR, данных, интеграции без номеров."
    severity_guide:
      critical: "Не применяется."
      major: "Дублирование ключевых правил уже привело к расхождениям или версия документа не зафиксирована при наличии зависимых документов."
      minor: "Отдельные повторы без расхождений."

  traceable:
    name_ru: "Трассируемость"
    standard: "IEEE 830-1998 §4.3.8"
    scope: set
    definition_ru: >-
      Происхождение каждого требования ясно (обратная трассировка к цели, бизнес-требованию,
      источнику), и на каждое требование можно сослаться из проектирования, кода и тестов
      (прямая трассировка) благодаря уникальному идентификатору.
    check_questions:
      - "Есть ли у каждого требования уникальный идентификатор?"
      - "Можно ли связать каждое функциональное требование с целью или бизнес-требованием?"
      - "Ссылаются ли критерии приёмки на требования, которые они проверяют?"
      - "Ссылается ли дочерний документ (API) на требования родительского и наоборот однозначно (название, версия)?"
    typical_defects:
      - "Критерии приёмки без ссылок на номера требований."
      - "Ссылка на дочерний документ без версии."
      - "Требования без идентификаторов в части разделов."
    severity_guide:
      critical: "Не применяется."
      major: "Нельзя установить, какие требования покрыты критериями приёмки и тестами."
      minor: "Трассировку можно восстановить по контексту, но она не оформлена."

# Сопоставление характеристик IEEE 830 §4.3 с критериями reqcheck и дополнительные проверки
# из IEEE 830, которые стоит учитывать при оценке соответствующего критерия.
cross_reference:
  - ieee830: "§4.3.1 Correct"
    maps_to: [correct]
    extra_checks:
      - "Каждое требование действительно должно выполняться системой; спорные утверждения подтверждаются источником (заказчик, регламент)."
  - ieee830: "§4.3.2 Unambiguous"
    maps_to: [unambiguous]
    extra_checks:
      - "Термины, которые могут иметь несколько значений, определены в глоссарии."
      - "Естественный язык проверяется на двусмысленность; при сложных правилах уместны таблицы решений или формулы."
  - ieee830: "§4.3.3 Complete"
    maps_to: [complete, set_complete]
    extra_checks:
      - "Определена реакция системы на все классы входных данных — допустимые и недопустимые — во всех ситуациях."
      - "Все рисунки, таблицы и диаграммы подписаны и упомянуты; определены все термины и единицы."
      - "Пометка «TBD» допустима только с указанием, кто, когда и как её закроет."
  - ieee830: "§4.3.4 Consistent"
    maps_to: [set_consistent]
    extra_checks:
      - "Нет конфликта характеристик реальных объектов (формат, единица, тип одного значения)."
      - "Нет логического или временного конфликта действий (A должно предшествовать B и одновременно наоборот)."
      - "Одно понятие не названо двумя разными терминами."
  - ieee830: "§4.3.5 Ranked for importance and/or stability"
    maps_to: [ranked]
    extra_checks: []
  - ieee830: "§4.3.6 Verifiable"
    maps_to: [verifiable, set_validatable]
    extra_checks:
      - "Формулировки «хорошо работает», «обычно», «не должно происходить» непроверяемы и заменяются конкретными условиями."
  - ieee830: "§4.3.7 Modifiable"
    maps_to: [modifiable]
    extra_checks: []
  - ieee830: "§4.3.8 Traceable"
    maps_to: [traceable]
    extra_checks: []
