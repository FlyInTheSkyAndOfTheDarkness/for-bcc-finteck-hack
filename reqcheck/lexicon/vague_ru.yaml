# Слабые и неоднозначные слова в требованиях (RU). ISO/IEC/IEEE 29148 §5.2.7 «Requirements language criteria».
# pattern — регулярное выражение Python (без учёта регистра), применяется к тексту блока требования;
# границы слова проставляются автоматически: (?<![а-яёa-z]) … (?![а-яёa-z]).
# class: verifiable — непроверяемая характеристика (время, качество); unambiguous — неоднозначность / открытый список.
# Строки в одинарных кавычках: обратный слеш не экранируется.
terms:
  # --- время / скорость
  - {term: 'быстро', pattern: 'быстр(о|ый|ая|ое|ые|ого|ой)', class: verifiable, hint: 'укажите измеримое время отклика (например, «не более N с в 95% случаев»)'}
  - {term: 'оперативно', pattern: 'оперативн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'замените на конкретный срок'}
  - {term: 'своевременно', pattern: 'своевременн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'укажите срок или событие-границу'}
  - {term: 'мгновенно', pattern: 'мгновенн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'укажите допустимую задержку в секундах'}
  - {term: 'в момент', pattern: 'в момент', class: verifiable, hint: 'укажите допустимую задержку относительно события (например, «не позднее N с после…»)'}
  - {term: 'сразу', pattern: 'сразу( же)?', class: verifiable, hint: 'укажите допустимую задержку'}
  - {term: 'в реальном времени', pattern: 'в (режиме )?реальном времени|real[- ]time', class: verifiable, hint: 'укажите допустимую задержку'}
  - {term: 'незамедлительно', pattern: 'незамедлительн(о|ый|ая)|немедленн(о|ый|ая)', class: verifiable, hint: 'укажите допустимую задержку'}
  # --- качество
  - {term: 'удобно', pattern: 'удобн(о|ый|ая|ое|ые|ого|ым)', class: verifiable, hint: 'задайте проверяемый критерий юзабилити (число шагов, время выполнения)'}
  - {term: 'интуитивно', pattern: 'интуитивн(о|ый|ая|ое|ые|ого)( понятн\w*)?', class: verifiable, hint: 'задайте проверяемый критерий'}
  - {term: 'понятно', pattern: 'понятн(о|ый|ая|ое|ые|ого)', class: unambiguous, hint: 'опишите конкретный текст или поведение'}
  - {term: 'корректно', pattern: 'корректн(о|ый|ая|ое|ые|ого|ым)', class: unambiguous, hint: 'перечислите, какой результат считается корректным'}
  - {term: 'надёжно', pattern: 'над[её]жн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'задайте метрику доступности или надёжности'}
  - {term: 'эффективно', pattern: 'эффективн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'задайте метрику эффективности'}
  - {term: 'гибко', pattern: 'гибк(о|ий|ая|ое|ие|ого)', class: unambiguous, hint: 'перечислите конкретные настраиваемые параметры'}
  - {term: 'оптимально', pattern: 'оптимальн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'укажите критерий оптимальности'}
  - {term: 'достаточно', pattern: 'достаточн(о|ый|ая|ое|ые|ого)', class: verifiable, hint: 'укажите конкретное значение'}
  - {term: 'максимально', pattern: 'максимально', class: unambiguous, hint: 'укажите конкретное значение или границу'}
  - {term: 'минимально', pattern: 'минимально', class: unambiguous, hint: 'укажите конкретное значение или границу'}
  - {term: 'высокий/низкий уровень', pattern: '(высок|низк)(ий|ая|ое|ие|ого) (уров|степен|скорост|производительност|нагрузк)\w*', class: verifiable, hint: 'задайте числовую границу'}
  - {term: 'современный', pattern: 'современн(ый|ая|ое|ые|ого)', class: unambiguous, hint: 'укажите конкретный стандарт или версию'}
  - {term: 'стандартный', pattern: 'стандартн(ый|ая|ое|ые|ого|ым|ом)', class: unambiguous, hint: 'дайте ссылку на конкретный стандарт или опишите поведение'}
  - {term: 'соответствующий', pattern: 'соответствующ(ий|ая|ее|ие|его|ей|им|ими)', class: unambiguous, hint: 'назовите конкретный объект'}
  # --- оговорки и открытые перечни
  - {term: 'как правило', pattern: 'как правило', class: unambiguous, hint: 'опишите исключения явно'}
  - {term: 'при необходимости', pattern: 'при необходимости|в случае необходимости', class: unambiguous, hint: 'укажите условие, при котором действие выполняется'}
  - {term: 'по возможности', pattern: 'по возможности|если возможно|при возможности', class: unambiguous, hint: 'решите, обязательно ли требование'}
  - {term: 'и т.д.', pattern: 'и т\.\s?д\.?|и т\.\s?п\.?|и пр\.|и др\.|и прочее|и так далее', class: unambiguous, hint: 'перечислите все элементы закрытым списком'}
  - {term: 'и далее', pattern: 'и далее', class: unambiguous, hint: 'перечислите все значения явно'}
  - {term: 'около / примерно', pattern: 'около(?= \d)|примерно|приблизительно|порядка(?= \d)', class: verifiable, hint: 'укажите точное значение и допуск'}
  - {term: 'и/или', pattern: 'и ?/ ?или', class: unambiguous, hint: 'выберите «и» либо «или» или опишите оба случая'}
  - {term: 'некоторые', pattern: 'некотор(ые|ых|ым|ый|ая)', class: unambiguous, hint: 'перечислите конкретно'}
