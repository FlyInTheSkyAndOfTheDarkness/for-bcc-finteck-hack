# Денежные единицы. minor — минорные (дробные) единицы, major — основные единицы валюты.
# Линтер units: если денежные величины задаются то в минорных, то в основных единицах
# (например, хранение в тиынах, порог в тенге) — нарушение согласованности набора (§5.2.6).
# Ищутся только явные указания единицы измерения: «в тиынах», «в тенге», «(₸)», «, ₸», «в KZT».
money:
  minor: ['тиын\w*', 'тийын\w*', 'копе(йк\w*|ек)', 'цент\w*', 'minor units?', 'cents?', 'минорн\w+ единиц\w*']
  major: ['тенге', '₸', 'тг', 'kzt', 'рубл\w+', 'rub', 'доллар\w*', 'usd', 'евро', 'eur']
