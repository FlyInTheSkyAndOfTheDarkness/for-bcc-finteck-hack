# Предметный чек-лист для требований к платёжным, карточным и банковским продуктам.
# Используется стадией set_completeness (плейсхолдер {fintech_checks}).
#
# Поля пункта:
#   id               — уникальный идентификатор FT-<AREA>-NN
#   area             — область (см. areas)
#   question_ru      — вопрос к документу: задан ли/определён ли аспект
#   applies_when     — ключевые основы слов (lowercase, поиск подстрокой по тексту документа);
#                      пункт применим, если найдена хотя бы одна; пустой список = применим всегда
#   criterion        — критерий reqcheck.models.Criterion, по которому оформляется находка
#   default_severity — критичность по умолчанию (critic может откалибровать)
#   why_ru           — что сломается в разработке/тестировании/эксплуатации, если аспект не определён
#
# Нормативные пункты сформулированы как вопросы, а не как утверждения о требованиях закона.

version: 1

areas:
  money: "Деньги и единицы"
  time: "Время и часовые пояса"
  lifecycle: "Жизненный цикл операции"
  idempotency: "Идемпотентность и порядок событий"
  notifications: "Уведомления"
  security: "Безопасность и персональные данные"
  api: "Контракт API"
  operations: "Эксплуатация, откат, мониторинг"
  process: "Процесс, версии, согласования"
  regulatory: "Регуляторный контекст"

items:

  # ------------------------------------------------------------- деньги ---
  - id: FT-MONEY-01
    area: money
    question_ru: "Для каждой суммы указано, в какой единице она хранится и передаётся — в основной (тенге) или дробной (тиын) — и одинаково ли это во всех разделах (бизнес-правила, API, данные)?"
    applies_when: ["сумм", "₸", "тенге", "тиын", "kzt", "amount", "лимит", "порог", "комисси", "баланс", "остат"]
    criterion: set_consistent
    default_severity: critical
    why_ru: "Расхождение единиц между частями документа даёт ошибку в 100 раз при сравнении и отображении сумм."
  - id: FT-MONEY-02
    area: money
    question_ru: "Определены ли правила округления (до какой единицы, в какую сторону, на каком шаге расчёта) и допустимы ли дробные значения во вводе пользователя?"
    applies_when: ["сумм", "₸", "тенге", "процент", "комисси", "ставк", "курс", "amount"]
    criterion: complete
    default_severity: major
    why_ru: "Без правила округления разные системы получают разные итоги, а тесты на границах неоднозначны."
  - id: FT-MONEY-03
    area: money
    question_ru: "Если операция может быть в валюте, отличной от валюты счёта или карты (картой в тенге можно платить в другой валюте, например за рубежом или онлайн), указано, какая сумма учитывается (в валюте операции или счёта), по какому курсу и на какой момент?"
    applies_when: ["валют", "kzt", "usd", "eur", "курс", "конверт", "карт", "зарубеж"]
    criterion: complete
    default_severity: major
    why_ru: "Сумма в валюте операции и в валюте счёта различаются; без правила нельзя рассчитать накопления и пороги."
  - id: FT-MONEY-04
    area: money
    question_ru: "Для числовых границ (лимиты, пороги, минимумы) указано, включительны ли они, и согласованы ли границы в бизнес-правилах и в валидации API?"
    applies_when: ["от ", "до ", "не менее", "не более", "минимал", "максимал", "лимит", "порог", "диапазон"]
    criterion: unambiguous
    default_severity: major
    why_ru: "Граничные значения — самые частые тест-кейсы; неопределённость включительности даёт споры при приёмке."

  # -------------------------------------------------------------- время ---
  - id: FT-TIME-01
    area: time
    question_ru: "Указан ли часовой пояс, в котором определяются дни, месяцы, отсечки и сроки, и в каком поясе хранятся и передаются метки времени?"
    applies_when: ["дат", "врем", "месяц", "сутк", "день", "период", "час", "timestamp", "срок"]
    criterion: unambiguous
    default_severity: major
    why_ru: "Операции около полуночи попадут в разные периоды в разных системах; тесты на границе периода невоспроизводимы."
  - id: FT-TIME-02
    area: time
    question_ru: "Указано, какая именно отметка времени операции определяет её период — время авторизации (совершения), время проведения/клиринга или время получения события системой?"
    applies_when: ["дат", "месяц", "период", "покупк", "операци", "транзакц", "провед", "клиринг", "авторизац"]
    criterion: unambiguous
    default_severity: critical
    why_ru: "Между совершением и проведением операции проходят часы и дни; от выбора отметки зависит, в какой период попадает сумма."
  - id: FT-TIME-03
    area: time
    question_ru: "Определено ли поведение на границе периода: операция, совершённая в конце одного периода и проведённая в начале следующего, и сброс накоплений в начале периода?"
    applies_when: ["месяц", "сутк", "период", "календар", "сброс", "накопл", "счётчик", "счетчик"]
    criterion: complete
    default_severity: major
    why_ru: "Граница периода — типичное место ошибок и обязательный тест-кейс; без правила результат угадывается."
  - id: FT-TIME-04
    area: time
    question_ru: "Для каждого срока (SLA, «в течение N») указано, от какого события отсчитывается, до какого события и в каком режиме (рабочие/календарные дни, круглосуточно)?"
    applies_when: ["в течение", "срок", "sla", "не позднее", "минут", "секунд", "час"]
    criterion: verifiable
    default_severity: major
    why_ru: "Срок без начала и конца отсчёта нельзя измерить и принять."
  - id: FT-TIME-05
    area: time
    question_ru: "Если операции зависят от рабочего дня или отсечки (cut-off), определено поведение в выходные, праздники и после времени отсечки?"
    applies_when: ["рабоч", "выходн", "праздн", "отсеч", "cut-off", "операционн", "банковск"]
    criterion: complete
    default_severity: major
    why_ru: "Операции вне операционного дня обрабатываются иначе; без правила неясна дата исполнения."

  # -------------------------------------------------- жизненный цикл ---
  - id: FT-LIFE-01
    area: lifecycle
    question_ru: "Различаются ли в правилах стадии операции — авторизация (холдирование), проведение/клиринг, отмена авторизации (reversal) — и указано, на какой стадии операция учитывается?"
    applies_when: ["покупк", "операци", "транзакц", "авторизац", "холд", "провед", "клиринг", "списан"]
    criterion: unambiguous
    default_severity: critical
    why_ru: "Учёт по авторизации и по проведению даёт разные суммы и время реакции; отменённые авторизации могут остаться в расчёте."
  - id: FT-LIFE-02
    area: lifecycle
    question_ru: "Определено ли, что считается возвратом (refund), отменой (reversal), опротестованием (chargeback), и как каждое из них влияет на расчёты; поддерживаются ли частичные возвраты?"
    applies_when: ["возврат", "отмен", "refund", "reversal", "chargeback", "опротест", "сторн"]
    criterion: complete
    default_severity: major
    why_ru: "Разные виды обратных операций обрабатываются по-разному; без определения реализации разойдутся."
  - id: FT-LIFE-03
    area: lifecycle
    question_ru: "Определено ли, что происходит, если обратная операция (возврат, отмена) приходит после того, как по исходной операции уже выполнено действие (уведомление отправлено, лимит исчерпан, статус изменён) — в том числе в другом периоде?"
    applies_when: ["возврат", "отмен", "refund", "уведомлен", "push", "sms", "лимит", "порог"]
    criterion: complete
    default_severity: critical
    why_ru: "Повторные или ложные действия и неверные накопления после возврата — частый источник жалоб; поведение должно быть задано."
  - id: FT-LIFE-04
    area: lifecycle
    question_ru: "Определено ли поведение, если накопленная величина после обратных операций становится отрицательной или меньше нуля в периоде (возврат больше расходов периода)?"
    applies_when: ["возврат", "уменьша", "счётчик", "счетчик", "накопл", "остат", "расход"]
    criterion: complete
    default_severity: major
    why_ru: "Отрицательные счётчики и повторное срабатывание порога после возврата дают неожиданные эффекты."
  - id: FT-LIFE-05
    area: lifecycle
    question_ru: "Перечислены ли исчерпывающе типы операций, которые учитываются и исключаются (покупки, переводы, снятие наличных, комиссии, платежи за услуги, онлайн/офлайн, операции по токенам и дополнительным картам)?"
    applies_when: ["покупк", "перевод", "снят", "наличн", "операци", "исключ", "учитыва"]
    criterion: complete
    default_severity: major
    why_ru: "Классификация операций определяется по кодам процессинга; без исчерпывающего списка спорные типы классифицируются произвольно."
  - id: FT-LIFE-06
    area: lifecycle
    question_ru: "Определено ли поведение при смене состояния объекта (карта/счёт заблокированы, перевыпущены, закрыты; клиент сменился; продукт отключён) — сохраняются ли настройки и накопления?"
    applies_when: ["карт", "счёт", "счет", "активн", "блокир", "перевыпуск", "закрыт", "статус"]
    criterion: complete
    default_severity: major
    why_ru: "При перевыпуске меняется идентификатор карты; без правила настройки и накопления теряются или дублируются."

  # --------------------------------------- идемпотентность и порядок ---
  - id: FT-IDEM-01
    area: idempotency
    question_ru: "Указано, по какому ключу распознаётся повторная доставка одного и того же события (идентификатор операции, ключ идемпотентности) и что именно должно остаться неизменным при повторе?"
    applies_when: ["повтор", "дубл", "идемпотент", "событи", "доставк", "retry", "idempot"]
    criterion: unambiguous
    default_severity: critical
    why_ru: "Без ключа и определения «исходного итога» повторы удваивают суммы или действия."
  - id: FT-IDEM-02
    area: idempotency
    question_ru: "Определено ли поведение при событиях не по порядку (возврат раньше покупки, проведение раньше авторизации, опоздавшее событие прошлого периода)?"
    applies_when: ["событи", "процессинг", "очеред", "асинхрон", "возврат", "порядок"]
    criterion: complete
    default_severity: major
    why_ru: "Асинхронные системы доставляют события не по порядку; результат расчёта зависит от правила."
  - id: FT-IDEM-03
    area: idempotency
    question_ru: "Для изменяющих запросов API указан механизм защиты от повторного выполнения (ключ идемпотентности, семантика повторного вызова, ответ на повтор)?"
    applies_when: ["post", "put", "patch", "save", "сохран", "созда", "api", "метод"]
    criterion: complete
    default_severity: major
    why_ru: "Сетевые повторы клиента приводят к двойным операциям или гонке изменений."
  - id: FT-IDEM-04
    area: idempotency
    question_ru: "Определено ли поведение при одновременной обработке нескольких событий по одному объекту (гонка: две операции почти одновременно пересекают порог/лимит)?"
    applies_when: ["одновремен", "параллел", "порог", "лимит", "максимум", "один раз", "не более"]
    criterion: complete
    default_severity: major
    why_ru: "При гонке ограничение «не более одного раза» нарушается без явного требования к атомарности."

  # ------------------------------------------------------ уведомления ---
  - id: FT-NOTIF-01
    area: notifications
    question_ru: "Определено содержание уведомления (обязательные поля, шаблон текста, язык — казахский/русский) и формат сумм и дат в нём?"
    applies_when: ["уведомлен", "push", "sms", "сообщени", "email", "оповещ"]
    criterion: complete
    default_severity: major
    why_ru: "Без шаблона текст придумывает разработчик; тестировщику нечего сверять."
  - id: FT-NOTIF-02
    area: notifications
    question_ru: "Какая гарантия доставки требуется (не более одного раза / не менее одного раза), что происходит, если канал недоступен или пользователь отключил уведомления в ОС, есть ли резервный канал?"
    applies_when: ["уведомлен", "push", "sms", "доставк", "отправ"]
    criterion: complete
    default_severity: major
    why_ru: "Push не гарантирован; без правила повторов и резервного канала нельзя проверить требование «клиент получает»."
  - id: FT-NOTIF-03
    area: notifications
    question_ru: "Различено ли «система передала уведомление на отправку» и «клиент получил уведомление», и к какому из событий привязаны требования и критерии приёмки?"
    applies_when: ["получает", "уведомлен", "push", "sms", "отправ"]
    criterion: verifiable
    default_severity: major
    why_ru: "Получение клиентом зависит от внешних провайдеров и не проверяется на стороне банка."
  - id: FT-NOTIF-04
    area: notifications
    question_ru: "Определено, как пользователь включает и отключает уведомления (согласие, значение по умолчанию) и что происходит с уже накопленными событиями при выключении/включении?"
    applies_when: ["включ", "выключ", "отключ", "подписк", "согласи", "переключател", "по умолчанию"]
    criterion: complete
    default_severity: minor
    why_ru: "Поведение при переключении — частый вопрос приёмки и жалоб клиентов."
  - id: FT-NOTIF-05
    area: notifications
    question_ru: "Маскируются ли номера карт и счетов в уведомлениях и не попадают ли в них данные, которые нельзя показывать на заблокированном экране?"
    applies_when: ["уведомлен", "push", "sms", "цифр", "номер карт", "pan", "маск"]
    criterion: complete
    default_severity: major
    why_ru: "Уведомления видны на экране блокировки; состав данных — вопрос безопасности."

  # ---------------------------------------- безопасность и ПДн ---
  - id: FT-SEC-01
    area: security
    question_ru: "Для каждого метода указаны аутентификация и проверка прав на конкретный объект (принадлежит ли карта/счёт пользователю сессии)?"
    applies_when: ["api", "метод", "authorization", "bearer", "токен", "сесси", "доступ"]
    criterion: complete
    default_severity: critical
    why_ru: "Без проверки принадлежности объекта возможен доступ к чужим данным по подобранному идентификатору (IDOR)."
  - id: FT-SEC-02
    area: security
    question_ru: "Согласован ли ответ на попытку доступа к чужому объекту (403 или 404) между описанием статусов и примерами, и выбран ли он осознанно, чтобы не раскрывать существование объекта?"
    applies_when: ["403", "404", "forbidden", "not found", "чуж", "доступ запрещ"]
    criterion: set_consistent
    default_severity: major
    why_ru: "Расхождение 403/404 ломает клиентскую обработку и тесты; выбор влияет на раскрытие информации."
  - id: FT-SEC-03
    area: security
    question_ru: "Не изменяют ли состояние методы, объявленные безопасными (GET), и не передаются ли изменяемые или чувствительные данные в URL/query-параметрах?"
    applies_when: ["get", "query", "url", "curl", "параметр"]
    criterion: correct
    default_severity: critical
    why_ru: "Изменяющий GET кэшируется, повторяется браузерами и прокси и уязвим к CSRF; параметры URL попадают в журналы."
  - id: FT-SEC-04
    area: security
    question_ru: "Указано ли, какие персональные и карточные данные хранятся и передаются, где они маскируются (журналы, ответы API, уведомления), и что полный номер карты не хранится и не передаётся вне защищённого контура?"
    applies_when: ["карт", "персональн", "номер", "pan", "клиент", "журнал", "лог", "хранит"]
    criterion: set_complete
    default_severity: major
    why_ru: "Обработка карточных и персональных данных требует определённого состава и защиты; это проверяется ИБ до разработки."
  - id: FT-SEC-05
    area: security
    question_ru: "Требуется ли журнал аудита изменений пользовательских настроек и значимых действий (кто, когда, с какого канала, старое и новое значение)?"
    applies_when: ["настройк", "измен", "сохран", "аудит", "журнал", "истори"]
    criterion: set_complete
    default_severity: minor
    why_ru: "Без аудита нельзя разобрать жалобу клиента («я не менял порог»)."
  - id: FT-SEC-06
    area: security
    question_ru: "Если идентификатор объекта передаётся клиентом, указано, что это не номер карты/счёта в открытом виде, а внутренний или токенизированный идентификатор?"
    applies_when: ["cardid", "card_id", "идентификатор карт", "accountid", "номер карт"]
    criterion: set_complete
    default_severity: major
    why_ru: "Номер карты в параметрах запроса — утечка карточных данных в журналы и кэш."

  # ------------------------------------------------------------- API ---
  - id: FT-API-01
    area: api
    question_ru: "Согласованы ли метод HTTP, описание назначения, логика и примеры запроса (один метод не описан одновременно как чтение и как сохранение)?"
    applies_when: ["rest", "get", "post", "put", "метод", "description", "api"]
    criterion: set_consistent
    default_severity: critical
    why_ru: "Противоречие в назначении метода делает контракт нереализуемым без решения автора."
  - id: FT-API-02
    area: api
    question_ru: "Единообразна ли модель ошибок: одна структура тела ошибки, однозначное соответствие статус-кодов и бизнес-ошибок (ошибка валидации не возвращается одновременно как 200 и как 400)?"
    applies_when: ["статус", "200", "400", "error", "ошибк", "message", "result"]
    criterion: set_consistent
    default_severity: major
    why_ru: "Клиент не знает, где искать ошибку; тестировщик не знает, какой ответ правильный."
  - id: FT-API-03
    area: api
    question_ru: "Для каждого параметра запроса и ответа указаны тип, формат, обязательность, допустимые значения, и совпадают ли типы одного поля в запросе, ответе и хранилище?"
    applies_when: ["параметр", "parameter", "format", "mandatory", "query", "body", "ответ"]
    criterion: set_consistent
    default_severity: major
    why_ru: "Число в запросе и строка в ответе для одного поля ломают клиентскую десериализацию."
  - id: FT-API-04
    area: api
    question_ru: "Указаны ли адреса всех окружений, версия API и правило обратной совместимости при изменениях контракта?"
    applies_when: ["url", "dev", "prod", "версия", "version", "swagger", "endpoint"]
    criterion: complete
    default_severity: minor
    why_ru: "Без версии и адресов окружений интеграция и регрессия не планируются."
  - id: FT-API-05
    area: api
    question_ru: "Определены ли тайм-ауты, повторы и поведение клиента при недоступности сервиса или ответе 5xx (что видит пользователь, сохраняется ли ввод)?"
    applies_when: ["500", "ошибка сервис", "недоступ", "таймаут", "тайм-аут", "timeout", "интеграц"]
    criterion: set_complete
    default_severity: minor
    why_ru: "Отказ внешнего сервиса — штатная ситуация; без требования UX ошибки непредсказуем."

  # ------------------------------------------------------ эксплуатация ---
  - id: FT-OPS-01
    area: operations
    question_ru: "Описан ли план отката или скрытия функциональности (feature flag), включая судьбу данных и уже отправленных действий при откате? Если шаблон ревью содержит пункт об откате, цитата — этот пункт."
    applies_when: ["откат", "отключ", "скрыт", "feature", "флаг", "релиз", "внедрен"]
    criterion: set_complete
    default_severity: major
    why_ru: "Без плана отката проблема в проде решается аварийно; шаблон ревью обычно требует его явно."
  - id: FT-OPS-02
    area: operations
    question_ru: "Определены ли метрики и алерты (задержка обработки, доля ошибок, отставание очереди событий, неотправленные уведомления) и кто на них реагирует?"
    applies_when: ["мониторинг", "метрик", "алерт", "sla", "в течение", "задержк"]
    criterion: set_complete
    default_severity: minor
    why_ru: "Без мониторинга нарушение SLA обнаруживается по жалобам клиентов."
  - id: FT-OPS-03
    area: operations
    question_ru: "Указаны ли нагрузка (число событий/запросов в секунду, пиковые периоды) и доступность сервиса, при которых должны выполняться сроки?"
    applies_when: ["нагрузк", "в течение", "производительн", "доступност", "rps", "tps", "минут", "секунд"]
    criterion: verifiable
    default_severity: major
    why_ru: "Срок без профиля нагрузки нельзя проверить нагрузочным тестом."
  - id: FT-OPS-04
    area: operations
    question_ru: "Определены ли сроки хранения данных (настройки, накопления, история операций, признаки отправки) и порядок их удаления или архивирования?"
    applies_when: ["хранит", "хранен", "данн", "истори", "архив"]
    criterion: set_complete
    default_severity: minor
    why_ru: "Неограниченное хранение — риск для ПДн и объёма; срок нужен для проектирования хранилища."

  # ---------------------------------------------- процесс и версии ---
  - id: FT-PROC-01
    area: process
    question_ru: "Заполнены ли версия, дата, автор документа и история изменений; указана ли версия связанных (дочерних) документов?"
    applies_when: []
    criterion: modifiable
    default_severity: minor
    why_ru: "Без версии невозможно понять, по какой редакции велась разработка и тестирование."
  - id: FT-PROC-02
    area: process
    question_ru: "Заполнен ли блок согласований (кто согласовал, роли, даты) и пройден ли чек-лист ревью, если он есть в шаблоне?"
    applies_when: ["согласован", "ревью", "чек-лист", "утвержд"]
    criterion: set_validatable
    default_severity: minor
    why_ru: "Неотмеченный чек-лист и пустые согласования означают, что документ не прошёл обязательное ревью."
  - id: FT-PROC-03
    area: process
    question_ru: "Есть ли критерии приёмки для каждой ветки бизнес-правил (включая исключения, границы и ошибки), и ссылаются ли они на номера требований?"
    applies_when: ["критери", "приемк", "приёмк", "ожидаем", "тест"]
    criterion: set_complete
    default_severity: major
    why_ru: "Ветки без критериев приёмки не будут протестированы или будут приняты по разным ожиданиям."

  # -------------------------------------------------------- регуляторика ---
  - id: FT-REG-01
    area: regulatory
    question_ru: "Учтено ли в требованиях, что с 2024 года в Казахстане действует единый часовой пояс UTC+5, и не опирается ли документ на название города вместо явного смещения/зоны?"
    applies_when: ["алмат", "астан", "казахстан", "местн", "врем", "kzt", "₸"]
    criterion: unambiguous
    default_severity: minor
    why_ru: "Название города в требовании оставляет вопрос о зоне в системах и тестовых окружениях; явная зона снимает неоднозначность."
  - id: FT-REG-02
    area: regulatory
    question_ru: "Нужно ли согласие клиента на обработку персональных данных для этой функциональности и кто проверяет соответствие законодательству РК о персональных данных и их защите?"
    applies_when: ["персональн", "клиент", "данн", "согласи", "push", "уведомлен"]
    criterion: set_complete
    default_severity: minor
    why_ru: "Вопрос соответствия должен быть закрыт до разработки, иначе возможна переделка."
  - id: FT-REG-03
    area: regulatory
    question_ru: "Подтверждено ли, что обработка карточных данных выполняется в контуре, соответствующем требованиям безопасности карточных данных (например, PCI DSS), и какие данные выходят за этот контур?"
    applies_when: ["карт", "pan", "процессинг", "cvv", "номер карт"]
    criterion: set_complete
    default_severity: minor
    why_ru: "Выход карточных данных за защищённый контур — блокер ИБ, обнаруженный поздно."
