# Общий чек-лист сквозной согласованности разделов (ISO/IEC/IEEE 29148 §5.2.6, IEEE 830 §4.3).
# Не зависит от предметной области. Формат пунктов — как в fintech.yaml.
# Используется стадией set.checklist вместе с предметным чек-листом.

version: 1

areas:
  coverage: "Сквозная согласованность разделов"
  terms: "Определения и измеримость"
  trace: "Трассировка, приоритеты, паспорт документа"
  accept: "Критерии приёмки"

items:

  # ----------------------------------------------------- сквозная полнота ---
  - id: RQ-COV-01
    area: coverage
    question_ru: "Для каждой операции, которую по тексту выполняет интерфейс или внешняя система (чтение, сохранение, удаление, получение данных для экрана), есть ли метод или контракт интеграции? Нет ли операций, обещанных в одном разделе (например, «читает и сохраняет»), но не описанных в спецификации API?"
    applies_when: ["api", "rest", "метод", "интеграц", "контракт", "endpoint", "читает", "получ"]
    criterion: set_complete
    default_severity: critical
    why_ru: "Обещанная, но не специфицированная операция блокирует разработку клиента: экран нечем заполнить."
  - id: RQ-COV-02
    area: coverage
    question_ru: "Покрывают ли требования к данным все сущности и поля, которые используют бизнес-правила и API (настройки, признаки включения, счётчики, отметки о выполненных действиях, типы операций), и указаны ли ключи, типы, связи и единицы?"
    applies_when: ["данн", "хранит", "хранить", "поле", "db field", "таблиц", "сущност"]
    criterion: set_complete
    default_severity: major
    why_ru: "Если модель данных не содержит того, что нужно правилам и API, разработчики спроектируют хранилище по-разному."
  - id: RQ-COV-03
    area: coverage
    question_ru: "Согласованы ли цель и бизнес-формулировки (обещания «мгновенно», «в момент», «всегда», «любой») с нефункциональными требованиями и правилами учёта, которые задают реальный момент и срок реакции?"
    applies_when: []
    criterion: set_consistent
    default_severity: major
    why_ru: "Цель, которая обещает больше, чем позволяют правила и NFR, приводит к спору при приёмке: что считать выполнением цели."
  - id: RQ-COV-04
    area: coverage
    question_ru: "Для каждого взаимодействия на схемах (sequence, BPMN, архитектура) однозначно определены отправитель, получатель и передаваемые данные: какая именно величина, какой идентификатор, кому адресовано сообщение? Согласованы ли схемы с правилами (ветвления, условия)?"
    applies_when: ["sequence", "bpmn", "схем", "диаграм", "→", "->"]
    criterion: unambiguous
    default_severity: minor
    why_ru: "Неоднозначная схема даёт разные реализации обмена между сервисами и разные ожидания в интеграционных тестах."
  - id: RQ-COV-05
    area: coverage
    question_ru: "Для каждой внешней системы и события интеграции указаны: формат и состав события, кто его отправляет, гарантия доставки и поведение при её отказе?"
    applies_when: ["интеграц", "событи", "процессинг", "сервис", "очеред", "kafka", "webhook"]
    criterion: set_complete
    default_severity: major
    why_ru: "Без состава события и правил отказа интеграцию нельзя реализовать и проверить."
  - id: RQ-COV-06
    area: coverage
    question_ru: "Проверяет ли API (или сервис) все условия, которые бизнес-правила накладывают на объект операции (допустимые состояния, тип, валюта, принадлежность, диапазоны значений), и совпадают ли эти проверки с правилами? Согласована ли обязательность параметров с логикой (поле обязательно, даже когда по смыслу не нужно, например при выключенной функции)?"
    applies_when: ["api", "rest", "метод", "параметр", "mandatory", "обязател"]
    criterion: set_consistent
    default_severity: major
    why_ru: "Правило, которое не проверяет API, на практике не выполняется: клиент сохранит недопустимую настройку."

  # ------------------------------------------------ термины и измеримость ---
  - id: RQ-TERM-01
    area: terms
    question_ru: "Определены ли (в глоссарии или в самом правиле) все понятия, от которых зависит расчёт или решение системы: какая операция считается учтённой, что входит в сумму, что такое период, какое событие запускает действие?"
    applies_when: []
    criterion: unambiguous
    default_severity: major
    why_ru: "Неопределённое ключевое понятие разработчик и тестировщик толкуют по-разному — расчёт расходится с ожиданием."
  - id: RQ-TERM-02
    area: terms
    question_ru: "Перечни, задающие состав (какие операции входят или исключаются, какие статусы допустимы), исчерпывающие и формальные (коды, типы), или оставлены открытыми и описательными?"
    applies_when: ["входят", "исключа", "включа", "кроме", "в том числе", "и т.д", "и т. п", "и далее", "перечен"]
    criterion: complete
    default_severity: major
    why_ru: "Открытый перечень не позволяет однозначно классифицировать операцию, отсутствующую в списке."
  - id: RQ-TERM-03
    area: terms
    question_ru: "Обещания о поведении при сбоях и повторах («сохраняет исходный итог», «не дублирует», «гарантированно») сформулированы проверяемо: указан ключ, что именно не меняется, как это проверить?"
    applies_when: ["повтор", "дубл", "сохраняет", "гарант", "исходн", "однократ"]
    criterion: verifiable
    default_severity: major
    why_ru: "Расплывчатое обещание нельзя реализовать однозначно и нельзя принять тестом."
  - id: RQ-TERM-04
    area: terms
    question_ru: "Каждое понятие (роль пользователя, объект, компонент системы) во всех разделах называется одним и тем же термином? Нет ли синонимов, из-за которых непонятно, один это объект или разные (например, «клиент», «держатель» и «владелец»; «сервис настроек» и «контроллер»)?"
    applies_when: []
    criterion: unambiguous
    default_severity: minor
    why_ru: "Разные названия одного объекта читаются как разные объекты: разработчики заводят лишние сущности, тестировщики — лишние проверки."

  # ------------------------------------------------- трассировка, паспорт ---
  - id: RQ-TRACE-01
    area: trace
    question_ru: "Есть ли у требований приоритет или степень важности и стабильности (IEEE 830 §4.3.5) и ссылаются ли критерии приёмки и тесты на номера требований (трассировка, §4.3.8)? Цитата — заголовок таблицы критериев приёмки (строка с названиями столбцов) или требование без приоритета."
    applies_when: []
    criterion: traceable
    default_severity: minor
    why_ru: "Без приоритетов нельзя решить, что делать при нехватке времени; без трассировки — доказать покрытие требований тестами."
  - id: RQ-TRACE-02
    area: trace
    question_ru: "Заполнены ли паспортные поля документа конкретными значениями (ответственные лица по ролям, ключ задачи в трекере, продукт, затрагиваемые системы), а не описаниями-заглушками вроде «учебные роли» или «без задачи»? Цитата — строка паспортной таблицы с заглушкой."
    applies_when: []
    criterion: conforming
    default_severity: minor
    why_ru: "Без владельцев и ссылки на задачу некому принимать решения по вопросам ревью и нельзя связать требования с работой."

  # ---------------------------------------------------- критерии приёмки ---
  - id: RQ-ACC-01
    area: accept
    question_ru: "В каждом критерии приёмки (примере, тест-кейсе) заданы ВСЕ предусловия, от которых по правилам зависит ожидаемый результат: состояние настроек и признаков (функция включена, действие в периоде уже было), тип, статус и валюта объекта, время с часовым поясом? Для негативных сценариев явно сказано, что НЕ должно произойти? Цитата — ячейка критерия с неполными предусловиями или ожидаемым результатом."
    applies_when: ["критери", "приемк", "приёмк", "исходные условия", "ожидаем", "пример"]
    criterion: verifiable
    default_severity: minor
    why_ru: "Без полных предусловий один и тот же пример тестировщики настраивают по-разному и получают разный результат."
  - id: RQ-ACC-02
    area: accept
    question_ru: "Покрывают ли критерии приёмки каждое функциональное правило, его границы и ветви ошибок (минимум один пример на правило и на каждую ветвь)? Цитата — заголовок таблицы критериев приёмки."
    applies_when: ["критери", "приемк", "приёмк", "исходные условия"]
    criterion: verifiable
    default_severity: major
    why_ru: "Правило без примера приёмки фактически не проверяется: дефект в нём уходит в прод."
