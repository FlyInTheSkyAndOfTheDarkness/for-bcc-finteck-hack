# Эталонная (gold) разметка дефектов документа docs/requirements.md
# «Уведомление о расходах по карте» (часть A + часть B REST API).
#
# Разметка выполнена вслепую (без просмотра промптов/критериев/отчётов агента)
# с позиции старшего BA/QA-ревьюера розничного банка (РК), по ISO/IEC/IEEE 29148:2018
# §5.2.5/§5.2.6 и IEEE 830-1998 §4.3.
#
# Поля:
#   quotes      — дословные цитаты из документа (для противоречий — обе стороны);
#                 сопоставляются нечётким поиском после нормализации (eval/textnorm.py).
#   criterion   — основной критерий (значение reqcheck.models.Criterion);
#   alt_criteria — другие допустимые критерии;
#   must_find   — ключевой дефект, который обязан найти любой хороший ревьюер.

- id: G-01
  title: Критерий приёмки о переходе месяца противоречит правилу Ф-2
  section: Часть A › Критерии приемки ↔ Функциональные требования › Ф-2
  quotes:
    - "Месяц определяется по дате совершения покупки в Алматы."
    - "Покупка 31 января в 23:58 на 4 000 ₸"
    - "Февральский счётчик вырос на 4 000 ₸"
  criterion: set_consistent
  alt_criteria: [correct, verifiable, unambiguous]
  severity: critical
  must_find: true
  description: >-
    По Ф-2 месяц определяется датой совершения покупки, значит покупка 31 января в 23:58
    должна попасть в январский счётчик. Критерий приёмки ожидает рост февральского счётчика,
    т.е. фактически использует дату проведения (1 февраля 00:03). Правило и критерий приёмки
    взаимоисключающие — реализацию невозможно принять. Дополнительно у времени 23:58 не указан
    часовой пояс.

- id: G-02
  title: Ф-4 допускает второй push в месяце вопреки лимиту Ф-3
  section: Часть A › Функциональные требования › Ф-3 ↔ Ф-4
  quotes:
    - "На карту приходится максимум один такой push за календарный месяц."
    - "следующее достижение вызывает push независимо от истории предыдущей настройки"
  criterion: set_consistent
  alt_criteria: [unambiguous, correct]
  severity: critical
  must_find: true
  description: >-
    Если push уже был отправлен в этом месяце, а клиент поднял порог выше накопленной суммы,
    по Ф-4 следующее достижение «вызывает push независимо от истории», что даёт второй push
    за месяц и прямо противоречит Ф-3 («максимум один»). Не определено, какое правило приоритетно.

- id: G-03
  title: Не описано снижение порога ниже уже накопленной суммы
  section: Часть A › Функциональные требования › Ф-4
  quotes:
    - "При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push"
  criterion: complete
  alt_criteria: [set_complete, unambiguous]
  severity: major
  must_find: true
  description: >-
    Ф-4 описывает только случай, когда накопленная сумма ниже нового порога. Ветка «новый порог
    меньше или равен накопленной сумме» не определена: отправлять push сразу при сохранении,
    при следующей покупке или не отправлять вовсе (по Ф-3 перехода «снизу вверх» не будет).

- id: G-04
  title: Не определено, что такое «проведённая покупка» (авторизация или клиринг)
  section: Часть A › Функциональные требования › Ф-2
  quotes:
    - "В расходы входят проведённые покупки."
  criterion: unambiguous
  alt_criteria: [complete, verifiable]
  severity: major
  must_find: true
  description: >-
    В карточном процессинге покупка проходит авторизацию (холд) и позже клиринг/списание.
    Не указано, на каком этапе покупка учитывается, как обрабатываются отмены авторизации
    (reversal), истечение холда, частичный клиринг, расхождение суммы авторизации и клиринга.
    От этого зависят и момент push, и итог месяца.

- id: G-05
  title: Цель «в момент покупки» не согласована с NFR и учётом проведённых покупок
  section: Часть A › Цели ↔ Нефункциональные требования ↔ Ф-2
  quotes:
    - "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки."
    - "Сервис передаёт push на отправку в течение минуты после получения события."
  criterion: set_consistent
  alt_criteria: [correct, feasible, verifiable, unambiguous]
  severity: major
  must_find: true
  description: >-
    Цель обещает уведомление «в момент покупки», NFR допускает минуту после получения события
    (а не после покупки) и измеряет лишь передачу на отправку, а не доставку. Если учитываются
    только проведённые (клиринговые) покупки, событие может прийти через дни после покупки —
    цель недостижима по построению.

- id: G-06
  title: Часовой пояс «в Алматы» и граница месяца заданы неоднозначно
  section: Часть A › Функциональные требования › Ф-2
  quotes:
    - "Месяц определяется по дате совершения покупки в Алматы."
  criterion: unambiguous
  alt_criteria: [complete, verifiable]
  severity: major
  must_find: false
  description: >-
    Не указано смещение UTC/идентификатор зоны (Asia/Almaty; с 2024 г. Казахстан перешёл на
    единый UTC+5). Не уточнено, чья «дата совершения» берётся (время терминала/мерчанта,
    процессинга, покупки за рубежом), и как трактуются границы 00:00/23:59:59.

- id: G-07
  title: Не описаны крайние случаи возврата
  section: Часть A › Функциональные требования › Ф-2
  quotes:
    - "Возврат уменьшает расходы месяца исходной покупки."
  criterion: complete
  alt_criteria: [unambiguous, set_complete]
  severity: major
  must_find: false
  description: >-
    Не определено: возврат в следующем месяце за покупку прошлого месяца (меняется ли закрытый
    месяц и что с уже отправленным push), частичный возврат, возврат без связи с исходной
    покупкой (неизвестен месяц), возврат больше суммы месяца (отрицательный итог), повторное
    достижение порога после возврата.

- id: G-08
  title: Перечень исключаемых операций неполон и не формализован
  section: Часть A › Функциональные требования › Ф-2
  quotes:
    - "Переводы и снятие наличных исключаются."
  criterion: complete
  alt_criteria: [unambiguous, verifiable]
  severity: major
  must_find: false
  description: >-
    Не указано, по какому признаку классифицируются операции (тип операции процессинга, MCC),
    и как учитываются платежи за услуги в приложении, quasi-cash, комиссии, card-to-card,
    пополнение кошельков, отмены. Без формального правила классификация непроверяема.

- id: G-09
  title: Не описан учёт покупок в иностранной валюте
  section: Часть A › Функциональные требования › Ф-1/Ф-2
  quotes:
    - "Держатель активной карты KZT задаёт целый порог"
    - "В расходы входят проведённые покупки."
  criterion: complete
  alt_criteria: [unambiguous, set_complete]
  severity: major
  must_find: false
  description: >-
    Карта в KZT, но покупки бывают в USD/EUR и др. Не указано, какая сумма учитывается
    (сумма в валюте счёта после конвертации, курс на дату авторизации или клиринга),
    как обрабатывается курсовая разница между авторизацией и списанием.

- id: G-10
  title: Неясно, к какому месяцу относится лимит push и сброс счётчика
  section: Часть A › Функциональные требования › Ф-3
  quotes:
    - "На карту приходится максимум один такой push за календарный месяц."
  criterion: unambiguous
  alt_criteria: [complete, verifiable]
  severity: major
  must_find: false
  description: >-
    «Календарный месяц» лимита push — месяц покупки (Ф-2) или месяц отправки? При позднем
    проведении январская покупка может пересечь январский порог в феврале: расходуется ли
    январский или февральский лимит. Не описаны сброс счётчика и признака отправки на новый
    месяц и сохранение порога между месяцами.

- id: G-11
  title: Не описано включение уведомления, когда сумма уже выше порога
  section: Часть A › Функциональные требования › Ф-3/Ф-1
  quotes:
    - "Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push."
    - "По умолчанию уведомление выключено."
  criterion: complete
  alt_criteria: [set_complete, unambiguous]
  severity: major
  must_find: false
  description: >-
    Если клиент включает уведомление (или задаёт порог) в середине месяца, когда расходы уже
    равны порогу или выше, перехода «снизу вверх» не будет и push никогда не придёт. Также не
    описано, считаются ли расходы и «переход» при выключенном уведомлении и что происходит при
    повторном включении.

- id: G-12
  title: Не описан сбой отправки push и смысл «признака отправки»
  section: Часть A › Ф-3 / Требования к данным
  quotes:
    - "клиент получает push"
    - "признак отправки"
  criterion: complete
  alt_criteria: [set_complete, unambiguous]
  severity: major
  must_find: false
  description: >-
    Не определено поведение при недоступности сервиса push, отсутствии push-токена или
    устройства, отключённых системных уведомлениях: повторы, резервный канал (SMS/in-app),
    расходуется ли месячный лимит. «Признак отправки» не различает «передано на отправку» и
    «доставлено».

- id: G-13
  title: Не описан жизненный цикл карты (неактивна, перевыпуск, закрытие)
  section: Часть A › Функциональные требования › Ф-1
  quotes:
    - "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно."
  criterion: complete
  alt_criteria: [unambiguous, set_complete]
  severity: major
  must_find: false
  description: >-
    Не определено, что значит «активная» карта (статусы), что происходит с настройкой и счётчиком
    при блокировке, перевыпуске (новый идентификатор карты), закрытии; как ведут себя
    мультивалютные карты и карты не в KZT (UI, API).

- id: G-14
  title: «Держатель» и «владелец» карты употребляются как синонимы
  section: Часть A › Ф-1 ↔ Часть B › Authorization
  quotes:
    - "Держатель активной карты KZT"
    - "Bearer, сессия владельца карты"
  criterion: set_consistent
  alt_criteria: [unambiguous, set_comprehensible]
  severity: minor
  must_find: false
  description: >-
    Для дополнительных карт держатель и владелец счёта — разные лица. Неясно, кто вправе
    настраивать порог и кому отправляется push (держателю допкарты или владельцу счёта).

- id: G-15
  title: Составные требования Ф-1, Ф-2, Ф-3 (несколько правил в одном пункте)
  section: Часть A › Функциональные требования
  quotes:
    - "задаёт целый порог от 1 000 до 1 000 000 ₸ включительно. По умолчанию уведомление выключено."
    - "Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки. Возврат уменьшает расходы месяца исходной покупки. Переводы и снятие наличных исключаются."
  criterion: singular
  alt_criteria: [traceable, modifiable, verifiable]
  severity: minor
  must_find: false
  description: >-
    Ф-2 содержит четыре независимых правила (граница месяца, состав, возвраты, исключения),
    Ф-1 и Ф-3 — по два. Это мешает трассировке к тестам и раздельной приёмке.

- id: G-16
  title: Набор нефункциональных требований неполон
  section: Часть A › Нефункциональные требования
  quotes:
    - "Сервис передаёт push на отправку в течение минуты после получения события."
  criterion: set_complete
  alt_criteria: [complete]
  severity: major
  must_find: true
  description: >-
    Единственное NFR — время передачи push. Нет требований к нагрузке (число карт, событий в
    секунду, пики), доступности, поведению при деградации зависимостей, журналированию и аудиту
    изменений настроек, хранению данных, информационной безопасности и банковской тайне
    (сумма расходов в push на заблокированном экране), мониторингу.

- id: G-17
  title: NFR «в течение минуты» непроверяемо в текущей формулировке
  section: Часть A › Нефункциональные требования
  quotes:
    - "в течение минуты после получения события"
  criterion: verifiable
  alt_criteria: [unambiguous]
  severity: minor
  must_find: false
  description: >-
    Не указаны перцентиль (p95/p99 или 100 %), нагрузка, при которой действует норматив,
    точка начала и конца измерения (какой компонент «получил событие», что значит «передаёт
    на отправку»).

- id: G-18
  title: Суммы покупок хранятся в тиынах, а порог — в тенге
  section: Часть A › Требования к данным
  quotes:
    - "сумму покупки в тиынах, признак отправки и порог в тенге"
  criterion: set_consistent
  alt_criteria: [unambiguous, correct, complete]
  severity: major
  must_find: true
  description: >-
    Сравниваемые величины хранятся в разных единицах (тиын = 1/100 тенге). Без явного правила
    пересчёта велик риск ошибки в 100 раз при сравнении с порогом; API и UI оперируют тенге.

- id: G-19
  title: Требования к данным не покрывают правила и API
  section: Часть A › Требования к данным ↔ Часть B › Query-параметры
  quotes:
    - "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге."
  criterion: set_complete
  alt_criteria: [complete, set_consistent]
  severity: major
  must_find: false
  description: >-
    В API есть поле БД `enabled`, а в требованиях к данным признака включения нет. Не указаны
    накопленная сумма месяца, тип операции (покупка/возврат), связь возврата с исходной
    покупкой, дата/время операции и часовой пояс, валюта, сроки хранения.

- id: G-20
  title: В части B нет метода чтения настроек и суммы за месяц
  section: Часть A › Требования к интеграции ↔ Дизайн UI ↔ Часть B
  quotes:
    - "Приложение читает и сохраняет настройки через дочерний документ"
    - "сумма за месяц"
  criterion: set_complete
  alt_criteria: [complete, set_consistent]
  severity: critical
  must_find: true
  description: >-
    Интеграция обещает чтение и сохранение, а часть B описывает только сохранение
    (`/alerts/saveLimit`). Экрану нужны текущие порог, состояние переключателя и сумма за месяц —
    метода для их получения нет; не описано и начальное состояние «по умолчанию выключено».

- id: G-21
  title: Интеграция с карточным процессингом не специфицирована
  section: Часть A › Архитектура / Sequence Diagram / Требования к интеграции
  quotes:
    - "Процессинг → сервис расходов: проведена покупка."
  criterion: set_complete
  alt_criteria: [complete]
  severity: major
  must_find: false
  description: >-
    Нет контракта события процессинга: транспорт, формат, поля (идентификатор операции, тип,
    дата/время с зоной, сумма и валюта, ссылка возврата на исходную покупку), гарантии доставки
    и порядок, события возвратов и отмен. Описан только REST для настроек.

- id: G-22
  title: Идемпотентность обработки событий сформулирована расплывчато
  section: Часть A › Требования к интеграции
  quotes:
    - "Повторная доставка одного события процессинга сохраняет исходный итог."
  criterion: unambiguous
  alt_criteria: [verifiable, complete]
  severity: major
  must_find: false
  description: >-
    Не указан ключ дедупликации (идентификатор операции? пара авторизация/клиринг?), что такое
    «исходный итог», не гарантируется отсутствие повторного push. Не описаны события вне порядка
    (возврат раньше покупки) и параллельная обработка двух покупок, одновременно пересекающих порог.

- id: G-23
  title: Раздел «Тестирование требований» не заполнен
  section: Часть A › Требования к тестированию
  quotes:
    - "заполняются тестировщиками"
  criterion: conforming
  alt_criteria: [set_complete, complete, verifiable]
  severity: minor
  must_find: true
  description: Раздел шаблона оставлен с заглушкой; тест-сценарии и ответственные не определены.

- id: G-24
  title: Критерии приёмки покрывают лишь малую часть правил
  section: Часть A › Критерии приемки
  quotes:
    - "Расходы 48 500 ₸, порог 50 000 ₸"
    - "Расходы 19 900 ₸, порог 20 000 ₸"
  criterion: set_complete
  alt_criteria: [verifiable, set_validatable, complete]
  severity: major
  must_find: true
  description: >-
    Три сценария не покрывают: границы порога 1 000/1 000 000 и недопустимые значения, состояние
    по умолчанию, возвраты, снятие наличных, лимит одного push в месяц, изменение порога (Ф-4),
    повторную доставку события, NFR по времени, ошибки API (400/401/404/500).

- id: G-25
  title: В критериях приёмки неполные предусловия
  section: Часть A › Критерии приемки
  quotes:
    - "Итог 50 000 ₸ и один push"
    - "Счётчик показывает 19 900 ₸"
  criterion: verifiable
  alt_criteria: [complete, unambiguous]
  severity: minor
  must_find: false
  description: >-
    Не указаны включённость уведомления, отсутствие push в текущем месяце, валюта/статус карты,
    часовой пояс времени 23:58; в сценарии перевода не зафиксировано ожидаемое отсутствие push.

- id: G-26
  title: Не заполнены версия и дата документа
  section: Часть A › Ревью требований
  quotes:
    - "Документ (версия/дата) в источнике не заполнен."
  criterion: conforming
  alt_criteria: [modifiable, traceable]
  severity: minor
  must_find: true
  description: Нет версии и даты — невозможно управлять изменениями и ссылаться на согласованную редакцию.

- id: G-27
  title: Чек-лист ревью не заполнен
  section: Часть A › Ревью требований
  quotes:
    - "Пункты чек-листа приведены как в шаблоне, отметки не проставлены."
  criterion: conforming
  alt_criteria: [set_validatable]
  severity: minor
  must_find: true
  description: Ни один пункт чек-листа (в т.ч. ИБ, архитектура, откат) не отмечен — ревью формально не проведено.

- id: G-28
  title: Блок согласующих пуст
  section: Часть A › Блок согласующих
  quotes:
    - "Подразделение | ФИО ответственного | Подпись"
  criterion: conforming
  alt_criteria: [set_validatable]
  severity: major
  must_find: true
  description: >-
    Нет ни одного согласующего (архитектура, ИБ, процессинг, владельцы смежных систем) —
    документ не может считаться утверждённым для старта разработки.

- id: G-29
  title: Description метода противоречит сам себе (сохранение vs чтение)
  section: Часть B › Общие параметры › Description
  quotes:
    - "Сохранение порога. Функциональные требования: чтение порога"
  criterion: set_consistent
  alt_criteria: [unambiguous, correct]
  severity: major
  must_find: true
  description: Метод описан одновременно как сохранение и как чтение порога; назначение метода не определено.

- id: G-30
  title: Изменение состояния через GET
  section: Часть B › Общие параметры › REST type / Request URL / CURL
  quotes:
    - "REST type | GET"
    - "/alerts/saveLimit"
  criterion: correct
  alt_criteria: [appropriate, set_consistent, conforming, feasible]
  severity: critical
  must_find: true
  description: >-
    Метод сохранения настройки объявлен как GET: нарушает безопасность/идемпотентность GET
    (RFC 9110), ответы могут кэшироваться, запросы — повторяться прокси и префетчем, параметры
    оседают в логах. Нужен POST/PUT/PATCH с телом; глагол в URL (`saveLimit`) не по REST.

- id: G-31
  title: Идентификатор карты и параметры передаются в URL
  section: Часть B › CURL / Query-параметры
  quotes:
    - "cardId=demo-42&amount=50000&enabled=1"
  criterion: correct
  alt_criteria: [appropriate, complete, feasible]
  severity: major
  must_find: false
  description: >-
    `cardId` и сумма в query-строке попадают в журналы веб-серверов, прокси, историю.
    Не указано, что `cardId` — не PAN (токен/внутренний ID); требования ИБ к нему отсутствуют.

- id: G-32
  title: Не заполнены поля паспорта API (Prod URL, Swagger, проект)
  section: Часть B › Общие параметры
  quotes:
    - "Dev: `/alerts/saveLimit` . Prod: —"
    - "Swagger | —"
  criterion: conforming
  alt_criteria: [complete, traceable]
  severity: minor
  must_find: false
  description: >-
    Prod URL и Swagger отсутствуют, Gitlab project/Framework — заглушки «Учебный контур»;
    контракт API нельзя проверить по машиночитаемой спецификации.

- id: G-33
  title: Content-Type application/json при отсутствии тела
  section: Часть B › Request body
  quotes:
    - "Content-Type:** `application/json` ."
    - "Тело не используется."
  criterion: set_consistent
  alt_criteria: [unambiguous, correct]
  severity: minor
  must_find: false
  description: Для запроса без тела указан Content-Type JSON; формат передачи параметров неясен.

- id: G-34
  title: API не проверяет активность и валюту карты из Ф-1
  section: Часть B › Логика работы метода ↔ Часть A › Ф-1
  quotes:
    - "Проверить принадлежность карты клиенту."
    - "Держатель активной карты KZT"
  criterion: set_consistent
  alt_criteria: [complete, set_complete]
  severity: major
  must_find: true
  description: >-
    Ф-1 разрешает настройку только для активной карты в KZT, а логика метода проверяет лишь
    сессию, принадлежность, сумму и переключатель. Нет шага проверки статуса/валюты карты и
    кода ответа для неактивной или не-KZT карты.

- id: G-35
  title: «Вернуть прежнее состояние» не соответствует примеру ответа ERROR
  section: Часть B › Логика работы метода › п.5 ↔ Ответ
  quotes:
    - "При отклонении суммы вернуть прежнее состояние и результат ERROR."
    - '{"result":"ERROR","message":"Проверьте сумму"}'
  criterion: set_consistent
  alt_criteria: [unambiguous, complete]
  severity: major
  must_find: false
  description: >-
    По логике при отклонении суммы возвращается прежнее состояние, но в таблице ответа `amount`
    заполняется только «при успехе», а пример ERROR не содержит ни `amount`, ни `enabled`.
    Также неясно, что значит «вернуть прежнее состояние» — откат или ответ с прежними значениями.

- id: G-36
  title: Ошибка валидации возвращается как 200 ERROR и одновременно как 400
  section: Часть B › Статусы › 200 ↔ 400
  quotes:
    - "**400.** Ответ в случае, если параметры запроса заполнены неверно."
    - '{"result":"ERROR","message":"Проверьте сумму"}'
  criterion: set_consistent
  alt_criteria: [unambiguous, correct, verifiable]
  severity: major
  must_find: true
  description: >-
    Неверная сумма — это неверно заполненный параметр (400), но пример под статусом 200
    содержит result ERROR «Проверьте сумму». Клиент не может однозначно определить успех по
    HTTP-коду, тесты не могут задать ожидаемый статус.

- id: G-37
  title: Типы полей запроса и ответа не совпадают (integer vs string)
  section: Часть B › Query-параметры ↔ Ответ
  quotes:
    - "`amount` | integer | 32 bit"
    - "`amount` | string | При успехе"
    - "`enabled` | string | «0» или «1»"
  criterion: set_consistent
  alt_criteria: [correct, unambiguous]
  severity: major
  must_find: true
  description: >-
    В запросе `amount` и `enabled` — integer, в ответе те же поля (то же поле БД) — string
    («50000», «1»). Денежная сумма строкой без формата; признак включения разумнее boolean.

- id: G-38
  title: Статус 200 подписан как «Created»
  section: Часть B › Статусы › 200
  quotes:
    - "200. Successful — Created"
  criterion: set_consistent
  alt_criteria: [correct, unambiguous, conforming]
  severity: major
  must_find: true
  description: >-
    Код 200 соответствует фразе OK, Created — это 201. В связке с фразой «200 или 201 —
    успешный» неясно, какой код реально возвращает сохранение.

- id: G-39
  title: Раздел 403 описывает возврат 404; 404 нет в перечне статусов
  section: Часть B › Статусы › 403
  quotes:
    - "Для чужой карты возвращается 404, как и для отсутствующей карты."
    - "**403.** Ответ в случае, если на указанный ресурс доступ запрещен."
  criterion: set_consistent
  alt_criteria: [unambiguous, complete, correct]
  severity: major
  must_find: true
  description: >-
    Перечень обещает 403 при запрете доступа, а раздел 403 говорит, что для чужой карты
    возвращается 404; когда же возвращается 403 — не определено. Код 404 в перечне статусов
    отсутствует.

- id: G-40
  title: Правило успешности и перечень статусов не согласованы
  section: Часть B › Ответ / Статусы
  quotes:
    - "Если результат 200 или 201 — успешный. Если результат 400, 401 и далее — неуспешный."
    - "**401.** Ответ в случае, если запрос выполнен без необходимой авторизации."
  criterion: set_consistent
  alt_criteria: [unambiguous, conforming, set_comprehensible]
  severity: minor
  must_find: false
  description: >-
    Упомянут 201, которого нет среди статусов; «и далее» — открытый перечень. Перечень статусов
    разорван: 200 и 400 до примера 200, а 401/403/500 — после него; 404 и 429 отсутствуют.

- id: G-41
  title: Структура ответов об ошибке разнородна, нет кодов ошибок
  section: Часть B › Статусы
  quotes:
    - '{"message":"Некорректный запрос"}'
    - "`message` | string | При ошибке"
  criterion: set_consistent
  alt_criteria: [complete, unambiguous]
  severity: minor
  must_find: false
  description: >-
    Ответы 400/401/404/500 не содержат `result`, описанный в таблице ответа как обязательный исход;
    ошибки различаются только текстом сообщения без машиночитаемого кода.

- id: G-42
  title: Правило «обе границы включены» без указания границ
  section: Часть B › Особые правила › п.1
  quotes:
    - "Целое число тенге, обе границы включены."
  criterion: unambiguous
  alt_criteria: [complete, modifiable]
  severity: minor
  must_find: false
  description: >-
    Правило ссылается на границы, не называя их; значения 1 000–1 000 000 приходится брать из
    таблицы параметров и Ф-1, что дублирует правило и создаёт риск рассинхронизации.

- id: G-43
  title: Сумма обязательна даже при выключении уведомления
  section: Часть B › Query-параметры
  quotes:
    - "`amount` | integer | 32 bit | Да | 1 000–1 000 000"
  criterion: complete
  alt_criteria: [unambiguous, set_consistent]
  severity: minor
  must_find: false
  description: >-
    Чтобы выключить уведомление (enabled=0), клиент обязан передать валидную сумму; не описано,
    сохраняется ли порог при выключении и что вернуть, если сумма не задана.

- id: G-44
  title: Компоненты названы по-разному в разных разделах
  section: Часть A › Влияние на ИС / Архитектура / Sequence ↔ Часть B › Схема
  quotes:
    - "Мобильный банк, карточный процессинг, сервис уведомлений"
    - "Мобильное приложение → сервис настроек. Карточный процессинг → учёт расходов → сервис push."
    - "Приложение → AlertsController → хранилище настроек → AlertsController → приложение."
  criterion: set_consistent
  alt_criteria: [set_comprehensible, unambiguous, traceable]
  severity: minor
  must_find: false
  description: >-
    «Учёт расходов» / «сервис расходов», «сервис push» / «сервис уведомлений», «сервис настроек» /
    AlertsController / «хранилище настроек». В «Влияние на ИС» нет новых сервисов настроек и учёта
    расходов. Неясно, сколько систем затрагивается и кто владелец.

- id: G-45
  title: BPMN-схема без ветвлений
  section: Часть A › BPMN схема процесса
  quotes:
    - "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение."
  criterion: complete
  alt_criteria: [set_complete]
  severity: minor
  must_find: false
  description: >-
    Нет проверки включённости уведомления и признака «push уже отправлен в этом месяце», веток
    возврата, исключаемых операций, ошибок отправки; процесс настройки порога не отражён.

- id: G-46
  title: В sequence неясно, какая «сумма» уходит в push, и нет получателя
  section: Часть A › Sequence Diagram
  quotes:
    - "передать последние четыре цифры карты и сумму при достижении порога"
  criterion: unambiguous
  alt_criteria: [complete]
  severity: minor
  must_find: false
  description: >-
    «Сумма» — сумма покупки, накопленный итог или порог? Не указан получатель (клиент/устройство)
    и текст push; не описана реакция на недоступность сервиса настроек при синхронном запросе
    порога на каждую покупку.

- id: G-47
  title: Дизайн UI не детализирован
  section: Часть A › Дизайн процесса UI
  quotes:
    - "При ошибке ввода сообщение появляется под полем."
  criterion: complete
  alt_criteria: [unambiguous, verifiable]
  severity: minor
  must_find: false
  description: >-
    Нет текстов ошибок и правил валидации ввода, макета, поведения при ошибках API (401/404/500),
    отображения для неактивной/не-KZT карты, источника и периода «суммы за месяц».

- id: G-48
  title: Цель неизмерима, «личный бюджет» не совпадает с порогом по карте
  section: Часть A › Цели
  quotes:
    - "узнать о достижении личного бюджета"
  criterion: unambiguous
  alt_criteria: [verifiable, necessary, set_consistent]
  severity: minor
  must_find: false
  description: >-
    Цель без бизнес-метрики успеха. «Личный бюджет» подразумевает клиента целиком (все карты),
    а правила задают порог на одну карту.

- id: G-49
  title: Общие сведения заполнены заглушками (роли, JIRA)
  section: Часть A › Общие сведения
  quotes:
    - "Практикум без Jira-задачи"
    - "Учебные роли розничного бизнеса, владельца мобильного банка и аналитика команды"
  criterion: traceable
  alt_criteria: [conforming]
  severity: minor
  must_find: false
  description: Нет задачи в трекере и конкретных ответственных — нет трассировки и владельца требований.

- id: G-50
  title: Нет трассировки критериев приёмки к требованиям и приоритетов
  section: Часть A › Критерии приемки / Функциональные требования
  quotes:
    - "Исходные условия | Действие | Ожидаемый результат"
  criterion: traceable
  alt_criteria: [ranked, conforming]
  severity: minor
  must_find: false
  description: >-
    Критерии приёмки не имеют идентификаторов и ссылок на Ф-1…Ф-4; у требований нет приоритета
    и стабильности (IEEE 830 §4.3.5).

- id: G-51
  title: Не предусмотрены откат и скрытие функционала
  section: Часть A › Ревью требований
  quotes:
    - "Реализация задачи/проекта предусматривает схему отката решений"
  criterion: set_complete
  alt_criteria: [complete, conforming]
  severity: minor
  must_find: false
  description: >-
    Пункт чек-листа об откате не отмечен, в требованиях нет feature toggle / плана отката
    при массовых ошибочных push.
